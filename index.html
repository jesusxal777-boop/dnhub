<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNHub — Adult Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- macOS-style Menu Bar -->
  <header class="menu-bar glass">
    <div class="menu-left">
      <span class="logo">DNHub</span>
      <nav>
        <a href="#" class="active">Home</a>
        <a href="#">Categories</a>
        <a href="#">Trending</a>
        <a href="#">Premium</a>
      </nav>
    </div>
    <div class="menu-right">
      <div class="search-box glass">
        <input type="text" id="search" placeholder="Search..." />
      </div>
      <button class="btn-glass" id="loginBtn">Login</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero glass-panel">
    <div class="hero-content">
      <h1>DNHub</h1>
      <p>Premium adult entertainment • Liquid Glass Experience</p>
      <div class="hero-btns">
        <button class="btn-primary">Explore Now</button>
        <button class="btn-glass">Categories</button>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <section class="categories">
    <h2>Categories</h2>
    <div class="cat-grid" id="categories"></div>
  </section>

  <!-- Videos Grid -->
  <section class="videos-section">
    <div class="section-header">
      <h2>Trending Videos</h2>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="amateur">Amateur</button>
        <button class="filter-btn" data-filter="milf">MILF</button>
        <button class="filter-btn" data-filter="lesbian">Lesbian</button>
        <button class="filter-btn" data-filter="anal">Anal</button>
      </div>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </section>

  <!-- Footer -->
  <footer class="footer glass">
    <p>© 2026 DNHub • 18+ Only • All models are 18+</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
